services:
  php:
    build:
      context: docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./:/var/www/html
    environment:
      MAILER_DSN: smtp://mailer:1025
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapp", "-papp"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/mysql

  # Catches outgoing mail; web UI at http://localhost:8025
  mailer:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db-data:
