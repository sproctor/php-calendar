# Full configuration reference: https://symfony.com/bundles/ux-icons/current/index.html#configuration
ux_icons:
    # Bootstrap Icons, from the twbs/bootstrap-icons Composer package: {{ ux_icon('bi:gear') }}
    icon_sets:
        bi:
            path: '%kernel.project_dir%/vendor/twbs/bootstrap-icons/icons'

    # Never fetch icons from the Iconify API; everything comes from the package above
    iconify:
        enabled: false

    # Default HTML attributes to add to all icons
    default_icon_attributes:
        # Use current text color to fill the icon
        fill: currentColor
        # Default dimensions
        height: '1em'
        width: '1em'
        class: 'phpc-icon'

    # Throw an exception if an icon is not found
    ignore_not_found: false

when@prod:
    ux_icons:
        # Suppress exceptions for missing icons in production
        ignore_not_found: true
