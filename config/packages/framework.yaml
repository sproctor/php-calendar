# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    # A generated one until APP_SECRET is set; see App\Install\SecretEnvVarProcessor
    secret: '%env(app_secret:APP_SECRET)%'
    csrf_protection: true

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    assets:
        version_strategy: App\Asset\FileMtimeVersionStrategy

    property_info:
        with_constructor_extractor: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
