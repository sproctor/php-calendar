# Event descriptions are Markdown, rendered on the server by the markdown_to_html filter
twig_extra:
    commonmark:
        # Show any HTML in descriptions as text, and drop javascript: and similar links,
        # so the output is safe to put in the page as it is
        html_input: escape
        allow_unsafe_links: false
        max_nesting_level: 20

services:
    # GitHub-flavored Markdown: automatic links, tables, strikethrough and task lists,
    # which the browser-side renderer (marked) supported before
    League\CommonMark\Extension\GithubFlavoredMarkdownExtension:
        tags: ['twig.markdown.league_extension']
